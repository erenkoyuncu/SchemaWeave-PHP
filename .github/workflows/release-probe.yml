name: Release Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write probe marker
        uses: actions/github-script@v7
        with:
          script: |
            const content = Buffer.from('actions-ok\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/release-probe-ok.txt',
              message: 'Record GitHub Actions probe',
              content
            });
