name: Publish SchemaWeave PHP v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PHP package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/schemaweave-php dist
          cp composer.json README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md build/schemaweave-php/
          cp -R src build/schemaweave-php/src
          cp -R docs build/schemaweave-php/docs
          cp -R examples build/schemaweave-php/examples
          (cd build && zip -qr ../dist/schemaweave-php-1.0.0.zip schemaweave-php)
          unzip -t dist/schemaweave-php-1.0.0.zip
          (cd dist && sha256sum schemaweave-php-1.0.0.zip > SHA256SUMS.txt)
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # SchemaWeave PHP v1.0.0

          First stable public release of the framework-agnostic Schema.org JSON-LD engine behind SchemaWeave.

          ## Highlights
          - PHP 7.4+ and PSR-4 friendly architecture.
          - Organization, WebSite and LocalBusiness graph generation.
          - WebPage variants including AboutPage, ContactPage, ProfilePage, SearchResultsPage and CollectionPage.
          - Product and BlogPosting entities.
          - BreadcrumbList, ItemList and FAQPage support.
          - Replaceable DataProvider and URL resolver contracts.
          - Array and callback data-provider implementations.
          - Schema extension API for project-specific entity types.
          - Structural graph validation and safe JSON-LD script output.
          - Missing prices, offers, identifiers, ratings and reviews are omitted rather than fabricated.

          ## Package
          `schemaweave-php-1.0.0.zip` contains the core source, Composer metadata, documentation and integration examples.
          EOF

      - name: Create release and upload assets
        id: publish
        uses: actions/github-script@v7
        env:
          TARGET_SHA: 56b7e145f434d22ea43f5e80b7f1938bbcc194c1
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const tag = 'v1.0.0';
              const target = process.env.TARGET_SHA;
              const notes = fs.readFileSync('dist/RELEASE_NOTES.md', 'utf8');

              let release;
              try {
                release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                } catch (refError) {
                  if (refError.status !== 404) throw refError;
                  await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
                }
                release = (await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: target,
                  name: 'SchemaWeave PHP v1.0.0',
                  body: notes,
                  draft: false,
                  prerelease: false
                })).data;
              }

              const assets = [
                ['dist/schemaweave-php-1.0.0.zip', 'schemaweave-php-1.0.0.zip', 'application/zip'],
                ['dist/SHA256SUMS.txt', 'SHA256SUMS.txt', 'text/plain']
              ];
              const existing = (await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id, per_page: 100 })).data;
              for (const [path, name, contentType] of assets) {
                const old = existing.find(asset => asset.name === name);
                if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
                const data = fs.readFileSync(path);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.id,
                  name,
                  data,
                  headers: { 'content-type': contentType, 'content-length': data.length }
                });
              }
              fs.writeFileSync('/tmp/release-url.txt', release.html_url + '\n');
            } catch (error) {
              const details = error?.response?.data ? JSON.stringify(error.response.data) : '';
              fs.writeFileSync('/tmp/release-error.txt', `${error.status || ''} ${error.message || error}\n${details}\n`);
              throw error;
            }

      - name: Record outcome
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = fs.existsSync('/tmp/release-url.txt') ? fs.readFileSync('/tmp/release-url.txt', 'utf8').trim() : '';
            const error = fs.existsSync('/tmp/release-error.txt') ? fs.readFileSync('/tmp/release-error.txt', 'utf8').trim() : '';
            const text = [
              'SchemaWeave PHP v1.0.0 release workflow',
              `build=${process.env.BUILD_OUTCOME}`,
              `publish=${process.env.PUBLISH_OUTCOME}`,
              `url=${url}`,
              `error=${error}`
            ].join('\n') + '\n';
            const content = Buffer.from(text).toString('base64');
            const path = '.github/release-status-v1.0.0.txt';
            let sha;
            try { sha = (await github.rest.repos.getContent({ owner, repo, path })).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Record SchemaWeave PHP v1.0.0 release status',
              content,
              ...(sha ? { sha } : {})
            });
